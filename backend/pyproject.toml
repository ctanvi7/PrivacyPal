[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacypal-backend"
version = "0.1.0"
description = "Local FastAPI backend foundation for PrivacyPal"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pypdf>=5.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
